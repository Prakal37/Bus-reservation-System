# ==========================================
# SERVER CONFIGURATION
# ==========================================

server.port=8080
server.servlet.context-path=/api

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


# ==========================================
# H2 DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:h2:mem:bus_reservation_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver


# ==========================================
# H2 CONSOLE
# ==========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false


# ==========================================
# CONNECTION POOL
# ==========================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000


# ==========================================
# JWT CONFIGURATION
# ==========================================

jwt.secret=YourSecretKeyHereChangeInProduction1234567890YourSecretKeyHereChangeInProduction1234567890
jwt.expiration=86400000


# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=bus-reservation-system


# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging.level.root=INFO
logging.level.com.busreservation=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# ==========================================
# JACKSON CONFIGURATION
# ==========================================

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null


# ==========================================
# CORS CONFIGURATION
# ==========================================

spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false
spring.web.cors.max-age=3600